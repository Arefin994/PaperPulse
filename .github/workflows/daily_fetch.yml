name: Daily & Periodic Hugging Face Papers Scraper

on:
  schedule:
    # Runs automatically every day at 00:00 UTC
    - cron: '0 0 * * *'
  # Allows manual triggering from GitHub UI
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scraper Script
      run: python main.py

    - name: Commit and push generated Markdown files
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        mkdir -p daily_papers weekly_papers monthly_papers
        
        git add daily_papers/ weekly_papers/ monthly_papers/
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Hugging Face Paper Summaries" && git push)